<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1b4a" />
      <stop offset="45%" stop-color="#7a3a5d" />
      <stop offset="75%" stop-color="#e2703a" />
      <stop offset="100%" stop-color="#f5b04a" />
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2350" />
      <stop offset="100%" stop-color="#150b22" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#sky)" />

  <!-- sun -->
  <circle cx="300" cy="260" r="70" fill="#ffd27a" opacity="0.85" />
  <circle cx="300" cy="260" r="70" fill="#f5b04a" opacity="0.3" />

  <!-- far skyline -->
  <g fill="#3a2350" opacity="0.7">
    <rect x="0" y="330" width="40" height="120" />
    <rect x="45" y="300" width="35" height="150" />
    <rect x="85" y="345" width="50" height="105" />
    <rect x="480" y="310" width="45" height="140" />
    <rect x="530" y="340" width="40" height="110" />
    <rect x="565" y="290" width="35" height="160" />
  </g>

  <!-- near skyline silhouettes -->
  <g fill="#1c1128">
    <rect x="20" y="380" width="55" height="220" />
    <rect x="85" y="330" width="40" height="270" />
    <rect x="135" y="400" width="70" height="200" />
    <rect x="215" y="360" width="45" height="240" />
    <polygon points="260,600 260,340 285,300 310,340 310,600" />
    <rect x="330" y="420" width="60" height="180" />
    <rect x="400" y="370" width="35" height="230" />
    <rect x="445" y="410" width="80" height="190" />
    <rect x="535" y="350" width="45" height="250" />
  </g>

  <!-- lit windows -->
  <g fill="#ffe9a8" opacity="0.9">
    <rect x="30" y="400" width="6" height="8" /><rect x="45" y="400" width="6" height="8" />
    <rect x="30" y="425" width="6" height="8" /><rect x="60" y="425" width="6" height="8" />
    <rect x="95" y="350" width="6" height="8" /><rect x="110" y="365" width="6" height="8" />
    <rect x="95" y="390" width="6" height="8" /><rect x="110" y="410" width="6" height="8" />
    <rect x="145" y="420" width="6" height="8" /><rect x="165" y="440" width="6" height="8" />
    <rect x="185" y="420" width="6" height="8" /><rect x="150" y="460" width="6" height="8" />
    <rect x="225" y="385" width="6" height="8" /><rect x="245" y="405" width="6" height="8" />
    <rect x="340" y="450" width="6" height="8" /><rect x="360" y="470" width="6" height="8" />
    <rect x="375" y="450" width="6" height="8" /><rect x="345" y="490" width="6" height="8" />
    <rect x="410" y="395" width="6" height="8" /><rect x="410" y="420" width="6" height="8" />
    <rect x="460" y="430" width="6" height="8" /><rect x="480" y="450" width="6" height="8" />
    <rect x="500" y="430" width="6" height="8" /><rect x="465" y="470" width="6" height="8" />
    <rect x="550" y="375" width="6" height="8" /><rect x="550" y="400" width="6" height="8" />
  </g>

  <!-- river with reflection -->
  <rect x="0" y="500" width="600" height="100" fill="url(#river)" />
  <g fill="#f5b04a" opacity="0.35">
    <rect x="280" y="500" width="30" height="15" />
    <rect x="285" y="525" width="20" height="10" />
  </g>
</svg>
