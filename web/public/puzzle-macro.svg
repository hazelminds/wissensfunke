<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3a2a52" />
      <stop offset="100%" stop-color="#160f22" />
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <radialGradient id="petal" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f2a6d8" />
      <stop offset="100%" stop-color="#b04fa0" />
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />

  <!-- bokeh -->
  <g filter="url(#soft)">
    <circle cx="90" cy="90" r="45" fill="#f5b6e0" opacity="0.5" />
    <circle cx="520" cy="120" r="55" fill="#8fd6c8" opacity="0.4" />
    <circle cx="60" cy="480" r="60" fill="#f2c66b" opacity="0.35" />
    <circle cx="540" cy="500" r="50" fill="#f5b6e0" opacity="0.4" />
    <circle cx="300" cy="60" r="35" fill="#8fd6c8" opacity="0.4" />
    <circle cx="500" cy="330" r="40" fill="#f2c66b" opacity="0.3" />
  </g>

  <!-- background secondary flowers (soft, out of focus) -->
  <g opacity="0.5" filter="url(#soft)">
    <circle cx="140" cy="230" r="55" fill="#c766c2" />
    <circle cx="470" cy="420" r="65" fill="#9a5ec9" />
  </g>

  <!-- main flower, layered petals -->
  <g transform="translate(300,320)">
    <g>
      <ellipse cx="0" cy="-95" rx="55" ry="80" fill="url(#petal)" transform="rotate(0)" />
      <ellipse cx="0" cy="-95" rx="55" ry="80" fill="url(#petal)" transform="rotate(60)" />
      <ellipse cx="0" cy="-95" rx="55" ry="80" fill="url(#petal)" transform="rotate(120)" />
      <ellipse cx="0" cy="-95" rx="55" ry="80" fill="url(#petal)" transform="rotate(180)" />
      <ellipse cx="0" cy="-95" rx="55" ry="80" fill="url(#petal)" transform="rotate(240)" />
      <ellipse cx="0" cy="-95" rx="55" ry="80" fill="url(#petal)" transform="rotate(300)" />
    </g>
    <circle cx="0" cy="0" r="42" fill="#f7d94c" />
    <g fill="#c9a01f">
      <circle cx="-14" cy="-8" r="3" /><circle cx="6" cy="-16" r="3" /><circle cx="20" cy="2" r="3" />
      <circle cx="-4" cy="14" r="3" /><circle cx="-22" cy="6" r="3" /><circle cx="12" cy="16" r="3" />
    </g>
  </g>

  <!-- bee -->
  <g transform="translate(390,250) rotate(-20)">
    <ellipse cx="0" cy="0" rx="26" ry="17" fill="#2a2016" />
    <g fill="#f2c230">
      <rect x="-10" y="-17" width="8" height="34" rx="4" />
      <rect x="4" y="-17" width="8" height="34" rx="4" />
    </g>
    <ellipse cx="24" cy="-2" rx="10" ry="8" fill="#2a2016" />
    <g fill="#eaeaf5" opacity="0.85">
      <ellipse cx="-4" cy="-14" rx="16" ry="9" transform="rotate(-20 -4 -14)" />
      <ellipse cx="4" cy="10" rx="14" ry="8" transform="rotate(15 4 10)" />
    </g>
  </g>
</svg>
